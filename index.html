<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06131f">
  <title>WellsLink</title>

  <style>
    :root {
      --bg: #020b13;
      --panel: #071827;
      --panel-2: #0a2032;
      --panel-3: #0c2740;
      --line: #234762;
      --line-soft: rgba(92, 157, 205, .22);
      --text: #f5f9ff;
      --muted: #9ab6cb;
      --blue: #178bff;
      --blue-2: #57b3ff;
      --green: #35d67a;
      --green-deep: #0d8f4d;
      --danger: #ff6b6b;
      --shadow: 0 18px 50px rgba(0,0,0,.28);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(39, 121, 180, .22), transparent 32rem),
        linear-gradient(180deg, #05121d 0%, #020a12 100%);
      color: var(--text);
    }

    button, textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(18px, env(safe-area-inset-bottom));
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 8px 48px 18px;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(36px, 10vw, 56px);
      line-height: .95;
      letter-spacing: -2.6px;
      font-weight: 800;
    }

    .brand-title span {
      background: linear-gradient(180deg, #6dc5ff, #168cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 8px;
      text-align: center;
      color: #8eb8da;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .gear {
      position: absolute;
      right: 3px;
      top: 3px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #7fc4f4;
      font-size: 28px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .status-strip {
      display: grid;
      grid-template-columns: 1.5fr .5fr 1.5fr;
      border: 1px solid var(--line);
      background: rgba(8, 26, 41, .92);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.015);
      margin-bottom: 14px;
    }

    .status-card {
      min-width: 0;
      padding: 15px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .status-card + .status-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18%;
      height: 64%;
      width: 1px;
      background: var(--line-soft);
    }

    .status-icon {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      font-size: 21px;
    }

    .status-icon.radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #48e882;
      box-shadow: 0 0 18px rgba(72,232,130,.35);
    }

    .status-icon.battery {
      border: 1px solid #7ba8c3;
      border-radius: 3px;
      width: 12px;
      height: 22px;
      position: relative;
      padding: 3px;
    }

    .status-icon.battery::before {
      content: "";
      position: absolute;
      width: 6px;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: #7ba8c3;
      left: 7px;
      top: -7px;
    }

    .status-icon.battery::after {
      content: "";
      width: 100%;
      height: 74%;
      align-self: end;
      background: linear-gradient(180deg, #5bea8b, #26c96d);
      border-radius: 2px;
    }

    .status-icon.mesh {
      color: var(--green);
      background: rgba(53,214,122,.08);
      font-size: 15px;
    }

    .status-copy {
      min-width: 0;
    }

    .status-value {
      color: white;
      font-weight: 750;
      font-size: 17px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-value.connecting { color: #ffd36e; }
    .status-value.disconnected { color: #ff8d8d; }

    .status-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-panel {
      background: linear-gradient(180deg, rgba(9,31,49,.96), rgba(5,20,33,.98));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .map-shell {
      height: min(43vh, 390px);
      min-height: 290px;
      position: relative;
      background:
        radial-gradient(circle at 50% 52%, rgba(18,121,210,.18), transparent 24%),
        linear-gradient(135deg, rgba(38,74,93,.20) 1px, transparent 1px) 0 0/38px 38px,
        linear-gradient(45deg, rgba(31,65,84,.16) 1px, transparent 1px) 0 0/38px 38px,
        #071b2a;
    }

    .map-shell::before,
    .map-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .map-shell::before {
      background:
        linear-gradient(18deg, transparent 39%, rgba(91,127,147,.30) 40%, rgba(91,127,147,.30) 41%, transparent 42%),
        linear-gradient(132deg, transparent 44%, rgba(91,127,147,.20) 45%, rgba(91,127,147,.20) 46%, transparent 47%),
        linear-gradient(82deg, transparent 52%, rgba(91,127,147,.18) 53%, rgba(91,127,147,.18) 54%, transparent 55%);
      opacity: .7;
    }

    .map-topbar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      border-radius: 14px;
      background: rgba(2,12,20,.83);
      border: 1px solid rgba(97,157,194,.18);
    }

    .segmented span {
      min-width: 72px;
      text-align: center;
      padding: 9px 14px;
      border-radius: 11px;
      color: #8faec5;
      font-weight: 650;
      font-size: 15px;
    }

    .segmented .active {
      color: #fff;
      background: linear-gradient(180deg, #1c99ff, #0c79eb);
      box-shadow: 0 6px 18px rgba(10,126,238,.28);
    }

    .locate {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #dcefff;
      background: rgba(4,15,24,.72);
      display: grid;
      place-items: center;
      color: white;
      font-size: 20px;
    }

    #mapPanel {
      display: block !important;
      position: absolute !important;
      inset: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      border: 0 !important;
      border-radius: 0 !important;
      z-index: 1;
    }

    #gaMap {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      inset: 0;
    }

    #nearestRepeaters {
      display: none;
    }

    #gpsStatus {
      position: absolute;
      left: 18px;
      bottom: 14px;
      z-index: 3;
      padding: 8px 11px;
      border-radius: 12px;
      background: rgba(3,13,22,.74);
      color: #d9ecfa;
      font-size: 12px;
      backdrop-filter: blur(8px);
      max-width: calc(100% - 36px);
    }

    .map-radius {
      position: absolute;
      right: 16px;
      bottom: 14px;
      z-index: 3;
      color: #c6dbe9;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(3,13,22,.74);
      backdrop-filter: blur(8px);
    }

    .messages {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      min-height: 390px;
    }

    .messages-head {
      padding: 18px 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(89,139,170,.16);
    }

    .messages-title {
      margin: 0;
      font-size: 25px;
      letter-spacing: -.6px;
    }

    .room-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(55,99,131,.20);
      border: 1px solid rgba(101,158,195,.25);
      color: #b9d0df;
      font-size: 12px;
      white-space: nowrap;
    }

    .room-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(53,214,122,.35);
    }

    #roomMessages {
      flex: 1;
      min-height: 250px;
      max-height: 420px;
      overflow-y: auto;
      padding: 12px 16px 18px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .message-row.outgoing {
      justify-content: flex-end;
    }

    .avatar {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #55b6ff, #2c88e7);
      color: white;
      font-weight: 750;
      font-size: 12px;
      margin-top: 18px;
    }

    .message-stack {
      max-width: min(78%, 520px);
    }

    .message-row.outgoing .message-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .message-meta {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 5px 5px;
      font-size: 13px;
      color: #96b2c6;
    }

    .message-meta span {
      color: #f6fbff;
      font-weight: 700;
      font-size: 14px;
    }

    .bubble {
      background: linear-gradient(180deg, #29435c, #20384e);
      color: white;
      border-radius: 18px 18px 18px 6px;
      padding: 11px 14px;
      font-size: 16px;
      line-height: 1.35;
      text-align: left;
      word-break: break-word;
    }

    .message-row.outgoing .bubble {
      background: linear-gradient(180deg, #168dff, #0876eb);
      border-radius: 18px 18px 6px 18px;
    }

    .empty-chat {
      color: #8ba8bd;
      text-align: center;
      padding: 34px 16px;
      font-size: 14px;
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr 58px;
      gap: 10px;
      align-items: end;
      padding: 12px;
      border-top: 1px solid rgba(89,139,170,.16);
      background: rgba(2,11,18,.35);
    }

    #roomPostText {
      width: 100%;
      min-height: 54px;
      max-height: 120px;
      resize: vertical;
      border: 1px solid #28506b;
      outline: none;
      border-radius: 28px;
      background: #081d2d;
      color: white;
      padding: 15px 18px;
      font-size: 16px;
      line-height: 1.35;
    }

    #roomPostText::placeholder {
      color: #7393aa;
    }

    #roomPostText:focus {
      border-color: #3da2e8;
      box-shadow: 0 0 0 3px rgba(61,162,232,.10);
    }

    #sendRoomPost {
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      margin: 0;
      padding: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #39dc7d, #21b960);
      color: white;
      box-shadow: 0 10px 25px rgba(27,181,93,.24);
      font-size: 24px;
    }

    #sendRoomPost:disabled {
      opacity: .35;
      box-shadow: none;
    }

    #sendRoomStatus {
      min-height: 16px;
      padding: 0 18px 10px;
      color: #8fb2c8;
      font-size: 12px;
      text-align: right;
    }

    .technical {
      display: none !important;
    }

    #log, #roomStatus, #repeatersList {
      display: none;
    }

    @media (max-width: 430px) {
      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand {
        padding-bottom: 15px;
      }

      .status-card {
        padding: 13px 8px;
        gap: 7px;
      }

      .status-value {
        font-size: 13px;
      }

      .status-sub {
        font-size: 10px;
      }

      .map-shell {
        min-height: 270px;
        height: 39vh;
      }

      .messages {
        min-height: 360px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="brand">
      <div>
        <h1 class="brand-title">WellsLink</h1>
     
      <div class="gear" aria-hidden="true">⚙</div>
    </header>

    <section class="status-strip" aria-label="Radio status">
      <div class="status-card" id="radioStatusCard" role="button" tabindex="0" aria-label="Connect to radio">
        <div class="status-icon radio"></div>
        <div class="status-copy">
          <div id="status" class="status-value disconnected">Not connected</div>
          <div id="radioDeviceLabel" class="status-sub">RadioName</div>
        </div>
      </div>

      <div class="status-card">
        <div class="status-icon battery"></div>
        <div class="status-copy">
          <div id="batteryStatus" class="status-value">--%</div>
        
        </div>
      </div>

      <div class="status-card">
        <div class="status-icon mesh">⌁</div>
        <div class="status-copy">
          <div id="meshReadyMain" class="status-value">Mesh Ready</div>
          <div id="meshReadySub" class="status-sub">not checked yet</div>
        </div>
      </div>
    </section>

    <section class="section-panel map-shell" aria-label="Nearby repeater map">
      <div class="map-topbar">
        <div class="segmented" aria-hidden="true">
          <span class="active">Map</span>
          <span>List</span>
        </div>
        <div class="locate" aria-hidden="true">⌖</div>
      </div>

      <div id="mapPanel">
        <svg id="gaMap" viewBox="0 0 500 500"></svg>
        <div id="nearestRepeaters"></div>
      </div>

      <div id="gpsStatus">Waiting for radio connection…</div>
      <div class="map-radius">5 mile radius</div>
    </section>

    <section class="section-panel messages" aria-label="Family messages">
      <div class="messages-head">
        <h2 class="messages-title">Family Messages</h2>
        <div class="room-pill">
          <span class="room-dot"></span>
          <span id="familyStatus">Waiting</span>
        </div>
      </div>

      <div id="roomMessages">
        <div class="empty-chat">Connect the radio to load family messages.</div>
      </div>

      <div class="composer">
        <textarea id="roomPostText" placeholder="Type a message..." rows="1"></textarea>
        <button id="sendRoomPost" disabled aria-label="Send message">➤</button>
      </div>
      <div id="sendRoomStatus"></div>
    </section>

    <!-- Working MeshCore controls kept in the DOM but hidden from the family interface. -->
    <div class="technical">
      <button id="connect">CONNECT TO RADIO</button>
      <button id="mapRepeaters" disabled>SHOW REPEATER MAP</button>
      <button id="advert" disabled>ADVERTISE LOCALLY</button>
      <button id="flood" disabled>FLOOD ADVERTISE</button>
      <button id="repeaters" disabled>FIND REPEATERS</button>
      <button id="room" disabled>CHECK IN ROOM</button>
      <button id="readRoom" disabled>READ ROOM</button>
      <button id="closeMap">CLOSE MAP</button>
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
      <button id="resetMap">RESET</button>
    </div>

    <div id="roomStatus"></div>
    <div id="repeatersList"></div>
    <div id="log">Ready.</div>

  </main>

  <script type="module">


import {
  WebBleConnection
} from "https://esm.sh/@liamcottle/meshcore.js";


let connection = null;
let discoveryTag = null;
let discoveredRepeaters = [];
let discoveryTimer = null;

const status = document.getElementById("status");
const log = document.getElementById("log");
const connectBtn = document.getElementById("connect");
const advertBtn = document.getElementById("advert");
const floodBtn = document.getElementById("flood");

const repeatersBtn = document.getElementById("repeaters");
const repeatersList = document.getElementById("repeatersList");

const roomBtn = document.getElementById("room");
const roomStatus = document.getElementById("roomStatus");
const CHECKIN_ROOM_NAME = "GhostPacketCheckIn";
const CHECKIN_ROOM_PASSWORD = "177345";

const readRoomBtn = document.getElementById("readRoom");
const roomMessages = document.getElementById("roomMessages");

const LOCAL_RADIUS_MILES = 5;

const mapPanel =
  document.getElementById("mapPanel");

const closeMapBtn =
  document.getElementById("closeMap");

let roomPosts = [];

const roomPostText =
  document.getElementById("roomPostText");

const sendRoomPostBtn =
  document.getElementById("sendRoomPost");

const sendRoomStatus =
  document.getElementById("sendRoomStatus");

let currentRoom = null;

const mapRepeatersBtn =
  document.getElementById("mapRepeaters");

const gpsStatus =
  document.getElementById("gpsStatus");

const gaMap =
  document.getElementById("gaMap");

const nearestRepeaters =
  document.getElementById("nearestRepeaters");

const zoomInBtn = document.getElementById("zoomIn");
const zoomOutBtn = document.getElementById("zoomOut");
const resetMapBtn = document.getElementById("resetMap");

const batteryStatus =
  document.getElementById("batteryStatus");

const radioDeviceLabel =
  document.getElementById("radioDeviceLabel");

const batteryVolts =
  document.getElementById("batteryVolts");

const meshReadyMain =
  document.getElementById("meshReadyMain");

const meshReadySub =
  document.getElementById("meshReadySub");

const familyStatus =
  document.getElementById("familyStatus");

let mapView = {
  x: 0,
  y: 0,
  width: 500,
  height: 620
};

function applyMapView() {
  gaMap.setAttribute(
    "viewBox",
    `${mapView.x} ${mapView.y} ${mapView.width} ${mapView.height}`
  );
}

closeMapBtn.onclick = () => {

  mapPanel.style.display = "none";

};

zoomInBtn.onclick = () => {

  const factor = 0.75;

  const newWidth = mapView.width * factor;
  const newHeight = mapView.height * factor;

  mapView.x += (mapView.width - newWidth) / 2;
  mapView.y += (mapView.height - newHeight) / 2;

  mapView.width = newWidth;
  mapView.height = newHeight;

  applyMapView();
};


zoomOutBtn.onclick = () => {

  const factor = 1.33;

  const newWidth = mapView.width * factor;
  const newHeight = mapView.height * factor;

  mapView.x -= (newWidth - mapView.width) / 2;
  mapView.y -= (newHeight - mapView.height) / 2;

  mapView.width = Math.min(newWidth, 500);
  mapView.height = Math.min(newHeight, 620);

  if (mapView.width === 500) mapView.x = 0;
  if (mapView.height === 620) mapView.y = 0;

  applyMapView();
};


resetMapBtn.onclick = () => {

  mapView = {
    x: 0,
    y: 0,
    width: 500,
    height: 620
  };

  applyMapView();
};


function message(text) {
  log.innerHTML = text;
}


function uint32ToLE(value) {
  return [
    value & 0xff,
    (value >> 8) & 0xff,
    (value >> 16) & 0xff,
    (value >> 24) & 0xff
  ];
}

function bytesToHex(bytes) {
  return Array.from(bytes)
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}


function installDiscoveryListener() {

  connection.txCharacteristic.addEventListener(
    "characteristicvaluechanged",
    (event) => {

      const frame = new Uint8Array(event.target.value.buffer);

      // 0x8E = PUSH_CODE_CONTROL_DATA
      if (frame[0] !== 0x8E) return;

      const localSnr = (frame[1] << 24 >> 24) / 4;
      const localRssi = frame[2] << 24 >> 24;

      const pathLen = frame[3];

      const payloadStart = 4 + pathLen;
      const payload = frame.slice(payloadStart);

      if (payload.length < 6) return;

      // upper nibble 0x90 = DISCOVER_RESP
      const responseType = payload[0] & 0xF0;

      if (responseType !== 0x90) return;

      // lower nibble is node type
      const nodeType = payload[0] & 0x0F;

      // 2 = repeater
      if (nodeType !== 2) return;

      const remoteSnr = (payload[1] << 24 >> 24) / 4;

      const responseTag =
        payload[2] |
        (payload[3] << 8) |
        (payload[4] << 16) |
        (payload[5] << 24);

      // only accept replies to OUR discovery request
      if ((responseTag >>> 0) !== (discoveryTag >>> 0)) return;

      const pubKey = payload.slice(6);

      const pubKeyHex = bytesToHex(pubKey);

      // avoid duplicate responders
      if (discoveredRepeaters.some(r => r.pubKey === pubKeyHex)) {
        return;
      }

      discoveredRepeaters.push({
        pubKey: pubKeyHex,
        localSnr,
        localRssi,
        remoteSnr
      });

      showDiscoveryResults();
    }
  );
}
function showDiscoveryResults() {

  if (discoveredRepeaters.length === 0) {
    meshReadyMain.textContent = "Checking...";
    meshReadySub.textContent = "listening nearby";
    repeatersList.innerHTML = "";
    return;
  }

  let html =
    "<h3>✅ " +
    discoveredRepeaters.length +
    " nearby repeater" +
    (discoveredRepeaters.length === 1 ? "" : "s") +
    " found</h3>";

  discoveredRepeaters.forEach((r, i) => {

    html +=
      "<div style='padding:12px;border-bottom:1px solid #444;text-align:left;'>" +
      "<strong>Repeater " + (i + 1) + "</strong>" +
      "<br>Radio SNR: " + r.localSnr + " dB" +
      "<br>Repeater heard us: " + r.remoteSnr + " dB" +
      "<br>RSSI: " + r.localRssi + " dBm" +
      "<br><small>" + r.pubKey.substring(0, 16) + "...</small>" +
      "</div>";
  });

  repeatersList.innerHTML = "";
  meshReadyMain.textContent = "Mesh Ready";
  meshReadySub.textContent =
    discoveredRepeaters.length +
    " repeater" +
    (discoveredRepeaters.length === 1 ? "" : "s") +
    " heard";
}

connectBtn.onclick = async () => {

  try {

    status.innerHTML = "Connecting";

function readUint32LE(bytes, offset) {
  return (
    bytes[offset] |
    (bytes[offset + 1] << 8) |
    (bytes[offset + 2] << 16) |
    (bytes[offset + 3] << 24)
  ) >>> 0;
}

function decodeText(bytes) {
  return new TextDecoder("utf-8").decode(bytes);
}

async function requestNextMessage() {
  // CMD_SYNC_NEXT_MESSAGE = 0x0A
  await connection.sendToRadioFrame(
    new Uint8Array([0x0A])
  );
}

function installRoomMessageListener() {

  connection.txCharacteristic.addEventListener(
    "characteristicvaluechanged",
    async (event) => {

      const frame =
        new Uint8Array(event.target.value.buffer);

      // PUSH_CODE_MSG_WAITING
      // Radio says there is a queued message waiting.
      if (frame[0] === 0x83) {

        console.log("Message waiting");

        await requestNextMessage();

        return;
      }


      /*
        RESP_CODE_CONTACT_MSG_RECV_V3 = 16

        layout:

        0      response code
        1      SNR * 4
        2-3    reserved
        4-9    sender public-key prefix
        10     path length
        11     text type
        12-15  timestamp
        16...  message

        Room posts use SIGNED_PLAIN and include
        an additional four-byte author prefix before
        the actual text.
      */

      if (frame[0] === 16) {

        const snr =
          (frame[1] << 24 >> 24) / 4;

        const senderPrefix =
          bytesToHex(frame.slice(4, 10));

        const pathLen = frame[10];

        const txtType = frame[11];

        const timestamp =
          readUint32LE(frame, 12);

        let textStart = 16;

        let authorPrefix = null;

        /*
          Signed room posts contain an extra
          4-byte author public-key prefix.
        */
        if (txtType === 2) {

          authorPrefix =
            bytesToHex(frame.slice(16, 20));

          textStart = 20;
        }

        const text =
          decodeText(frame.slice(textStart));

        console.log(
          "ROOM MESSAGE:",
          {
            senderPrefix,
            authorPrefix,
            timestamp,
            snr,
            pathLen,
            txtType,
            text
          }
        );

        roomPosts.push({
          senderPrefix,
          authorPrefix,
          timestamp,
          snr,
          text
        });

        displayRoomPosts();

        // Keep draining the queue
        await requestNextMessage();

        return;
      }


      // RESP_CODE_NO_MORE_MESSAGES
      if (frame[0] === 10) {

        message(
          "✅ Room message sync complete."
        );

        if (roomPosts.length === 0) {

          roomMessages.innerHTML =
            '<div class="empty-chat">No family messages yet.</div>';

        }

        return;
      }

    }
  );
}


function displayRoomPosts() {

  let html = "";

  const posts = [...roomPosts].sort((a, b) => a.timestamp - b.timestamp);

  posts.forEach(post => {

    const whenDate = new Date(post.timestamp * 1000);
    const when = whenDate.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

    const sender =
      post.authorPrefix
        ? "Family"
        : "Family";

    html += `
      <div class="message-row incoming">
        <div class="avatar">${sender.substring(0,2).toUpperCase()}</div>
        <div class="message-stack">
          <div class="message-meta">
            <span>${sender}</span>
            <time>${when}</time>
          </div>
          <div class="bubble">${escapeHtml(post.text)}</div>
        </div>
      </div>
    `;
  });

  if (!posts.length) {
    html = `
      <div class="empty-chat">
        No family messages yet.
      </div>
    `;
  }

  roomMessages.innerHTML = html;
  roomMessages.scrollTop = roomMessages.scrollHeight;
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function uint32ToLEBytes(value) {
  return new Uint8Array([
    value & 0xff,
    (value >>> 8) & 0xff,
    (value >>> 16) & 0xff,
    (value >>> 24) & 0xff
  ]);
}

sendRoomPostBtn.onclick = async () => {

  try {

    const text =
      roomPostText.value.trim();

    if (!text) {
      sendRoomStatus.innerHTML =
        "Type a message first.";
      return;
    }

    if (!currentRoom) {
      throw new Error(
        "Room has not been selected."
      );
    }

    const roomKey =
      Uint8Array.from(
        Object.values(currentRoom.publicKey)
      );

    const recipientPrefix =
      roomKey.slice(0, 6);

    const textBytes =
      new TextEncoder().encode(text);

    const timestamp =
      Math.floor(Date.now() / 1000);

    /*
      CMD_SEND_TXT_MSG

      byte 0    = 0x02
      byte 1    = txt_type 0 = plain text
      byte 2    = attempt 0
      bytes 3-6 = timestamp
      bytes 7-12 = first 6 bytes of room public key
      bytes 13+ = message
    */

    const frame =
      new Uint8Array(
        13 + textBytes.length
      );

    frame[0] = 0x02;
    frame[1] = 0x00;
    frame[2] = 0x00;

    frame.set(
      uint32ToLEBytes(timestamp),
      3
    );

    frame.set(
      recipientPrefix,
      7
    );

    frame.set(
      textBytes,
      13
    );

    sendRoomStatus.innerHTML =
      "📡 Sending...";

    await connection.sendToRadioFrame(frame);

    sendRoomStatus.innerHTML = "Sent";

    const sentTime = new Date().toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"

    const outgoing = document.createElement("div");
    outgoing.className = "message-row outgoing";
    outgoing.innerHTML = `
      <div class="message-stack">
        <div class="message-meta"><time>${sentTime}</time></div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>

    roomMessages.appendChild(outgoing);
    roomMessages.scrollTop = roomMessages.scrollHeight;

    roomPostText.value = "";
    setTimeout(() => {
      sendRoomStatus.innerHTML = "";

  }

};

function toRadians(deg) {
  return deg * Math.PI / 180;
}

function toDegrees(rad) {
  return rad * 180 / Math.PI;
}


function distanceMiles(lat1, lon1, lat2, lon2) {

  const R = 3958.8;

  const dLat =
    toRadians(lat2 - lat1);

  const dLon =
    toRadians(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRadians(lat1)) *
    Math.cos(toRadians(lat2)) *
    Math.sin(dLon / 2) ** 2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


function bearingDegrees(lat1, lon1, lat2, lon2) {

  const φ1 = toRadians(lat1);
  const φ2 = toRadians(lat2);

  const λ1 = toRadians(lon1);
  const λ2 = toRadians(lon2);

  const y =
    Math.sin(λ2 - λ1) *
    Math.cos(φ2);

  const x =
    Math.cos(φ1) *
    Math.sin(φ2) -
    Math.sin(φ1) *
    Math.cos(φ2) *
    Math.cos(λ2 - λ1);

  return (
    toDegrees(Math.atan2(y, x)) + 360
  ) % 360;
}


function bearingName(deg) {

  const directions = [
    "N",
    "NE",
    "E",
    "SE",
    "S",
    "SW",
    "W",
    "NW"
  ];

  return directions[
    Math.round(deg / 45) % 8
  ];
}

const GA_BOUNDS = {
  north: 35.05,
  south: 30.35,
  west: -85.65,
  east: -80.75
};


function geoToMap(lat, lon) {

  const x =
    ((lon - GA_BOUNDS.west) /
    (GA_BOUNDS.east - GA_BOUNDS.west))
    * 500;

  const y =
    ((GA_BOUNDS.north - lat) /
    (GA_BOUNDS.north - GA_BOUNDS.south))
    * 620;

  return { x, y };
}

  north.setAttribute("fill", "#aaa");
  north.setAttribute("font-size", "18");

      "http://www.w3.org/2000/svg",

  userCircle.setAttribute("cy", "250");

  userCircle.setAttribute("fill", "#1188ff");
  userCircle.setAttribute("stroke", "#ffffff");
  userCircle.setAttribute("stroke-width", "3");

  gaMap.appendChild(userCircle);


  // Only show repeaters within radius
  const nearby =
    repeaters.filter(
      r => r.distance <= LOCAL_RADIUS_MILES
    );


  nearby.forEach(r => {

    /*
      Convert distance+bearing into map coordinates.

      220 pixels = LOCAL_RADIUS_MILES
    */

    const distanceRatio =
      r.distance / LOCAL_RADIUS_MILES;

    const pixelDistance =
      distanceRatio * 220;

    const angle =
      toRadians(r.bearing);

      250 -
      Math.cos(angle) *

      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
      );

    label.setAttribute("x", x + 10);
    label.setAttribute("y", y - 8);
    label.setAttribute("fill", "#ffffff");
    label.setAttribute("font-weight", "600");
    label.setAttribute("font-size", "12");

    label.textContent =
      r.name +
      " " +
      r.distance.toFixed(1) +
      " mi";

    gaMap.appendChild(label);

  });


  // Radius label

    );

  radiusLabel.setAttribute("y", "488");

  radiusLabel.setAttribute("font-size", "12");

  radiusLabel.textContent =

    " mile radius";

  gaMap.appendChild(radiusLabel);

}

async function resetContactPath(contact) {

  const publicKey =
    Uint8Array.from(
      Object.values(contact.publicKey)
    );

  const frame =
    new Uint8Array(1 + 32);

  frame[0] = 0x0D; // CMD_RESET_PATH

  frame.set(publicKey, 1);

  await connection.sendToRadioFrame(frame);
}

function installBatteryListener() {

  connection.txCharacteristic.addEventListener(
    "characteristicvaluechanged",
    (event) => {

      const frame =
        new Uint8Array(event.target.value.buffer);

      if (frame[0] !== 0x0C)
        return;

      if (frame.length < 4)
        return;

      const millivolts =
        frame[1] |
        (frame[2] << 8);

      const batteryPercent =
        frame[3];

      const volts =
        millivolts / 1000;

      batteryStatus.textContent =
        batteryPercent + "%";

      if (batteryVolts) {
        batteryVolts.textContent = volts.toFixed(2) + " V";
      }

      console.log(
        "Battery:",
        batteryPercent + "%",
        volts.toFixed(3) + "V"
      );

    }
  );

}
