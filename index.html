<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Family Mesh</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    #status {
      margin: 25px 0;
      font-size: 20px;
    }

    button {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: 15px auto;
      padding: 20px;
      font-size: 21px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
    }

    #connect {
      background: #eee;
    }

    #advert {
      background: #5ad66f;
    }

    #flood {
      background: #ffb347;
    }

    button:disabled {
      opacity: .35;
    }

    #log {
      margin-top: 30px;
      font-size: 14px;
      color: #aaa;
      text-align: left;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>

<body>

<h1>Family Mesh</h1>
<div>Simple MeshCore Controller</div>

<div id="status">🔴 Not connected</div>

<button id="connect">CONNECT TO RADIO</button>

<button id="advert" disabled>
  ADVERTISE LOCALLY
</button>

<button id="flood" disabled>
  FLOOD ADVERTISE
</button>

<button id="repeaters" disabled>
  FIND REPEATERS
</button>

<button id="room" disabled>
  CHECK IN ROOM
</button>

<button id="readRoom" disabled>
  READ ROOM
</button>

<textarea id="roomPostText"
          placeholder="Type check-in message..."
          style="width:100%;max-width:420px;height:80px;margin-top:15px;"></textarea>

<button id="sendRoomPost" disabled>
  SEND TO ROOM
</button>

<div id="sendRoomStatus"></div>

<div id="roomMessages"></div>

<div id="roomStatus"></div>

<div id="repeatersList"></div>


<div id="log">Ready.</div>


<script type="module">

import {
  WebBleConnection
} from "https://esm.sh/@liamcottle/meshcore.js";


let connection = null;
let discoveryTag = null;
let discoveredRepeaters = [];
let discoveryTimer = null;

const status = document.getElementById("status");
const log = document.getElementById("log");
const connectBtn = document.getElementById("connect");
const advertBtn = document.getElementById("advert");
const floodBtn = document.getElementById("flood");

const repeatersBtn = document.getElementById("repeaters");
const repeatersList = document.getElementById("repeatersList");

const roomBtn = document.getElementById("room");
const roomStatus = document.getElementById("roomStatus");
const CHECKIN_ROOM_NAME = "GhostPacketCheckIn";
const CHECKIN_ROOM_PASSWORD = "177345";

const readRoomBtn = document.getElementById("readRoom");
const roomMessages = document.getElementById("roomMessages");

let roomPosts = [];

const roomPostText =
  document.getElementById("roomPostText");

const sendRoomPostBtn =
  document.getElementById("sendRoomPost");

const sendRoomStatus =
  document.getElementById("sendRoomStatus");

let currentRoom = null;


function message(text) {
  log.innerHTML = text;
}


function uint32ToLE(value) {
  return [
    value & 0xff,
    (value >> 8) & 0xff,
    (value >> 16) & 0xff,
    (value >> 24) & 0xff
  ];
}

function bytesToHex(bytes) {
  return Array.from(bytes)
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}


function installDiscoveryListener() {

  connection.txCharacteristic.addEventListener(
    "characteristicvaluechanged",
    (event) => {

      const frame = new Uint8Array(event.target.value.buffer);

      // 0x8E = PUSH_CODE_CONTROL_DATA
      if (frame[0] !== 0x8E) return;

      const localSnr = (frame[1] << 24 >> 24) / 4;
      const localRssi = frame[2] << 24 >> 24;

      const pathLen = frame[3];

      const payloadStart = 4 + pathLen;
      const payload = frame.slice(payloadStart);

      if (payload.length < 6) return;

      // upper nibble 0x90 = DISCOVER_RESP
      const responseType = payload[0] & 0xF0;

      if (responseType !== 0x90) return;

      // lower nibble is node type
      const nodeType = payload[0] & 0x0F;

      // 2 = repeater
      if (nodeType !== 2) return;

      const remoteSnr = (payload[1] << 24 >> 24) / 4;

      const responseTag =
        payload[2] |
        (payload[3] << 8) |
        (payload[4] << 16) |
        (payload[5] << 24);

      // only accept replies to OUR discovery request
      if ((responseTag >>> 0) !== (discoveryTag >>> 0)) return;

      const pubKey = payload.slice(6);

      const pubKeyHex = bytesToHex(pubKey);

      // avoid duplicate responders
      if (discoveredRepeaters.some(r => r.pubKey === pubKeyHex)) {
        return;
      }

      discoveredRepeaters.push({
        pubKey: pubKeyHex,
        localSnr,
        localRssi,
        remoteSnr
      });

      showDiscoveryResults();
    }
  );
}
function showDiscoveryResults() {

  if (discoveredRepeaters.length === 0) {
    repeatersList.innerHTML =
      "<h3>Scanning...</h3><p>No repeater replies yet.</p>";
    return;
  }

  let html =
    "<h3>✅ " +
    discoveredRepeaters.length +
    " nearby repeater" +
    (discoveredRepeaters.length === 1 ? "" : "s") +
    " found</h3>";

  discoveredRepeaters.forEach((r, i) => {

    html +=
      "<div style='padding:12px;border-bottom:1px solid #444;text-align:left;'>" +
      "<strong>Repeater " + (i + 1) + "</strong>" +
      "<br>Radio SNR: " + r.localSnr + " dB" +
      "<br>Repeater heard us: " + r.remoteSnr + " dB" +
      "<br>RSSI: " + r.localRssi + " dBm" +
      "<br><small>" + r.pubKey.substring(0, 16) + "...</small>" +
      "</div>";
  });

  repeatersList.innerHTML = html;
}

connectBtn.onclick = async () => {

  try {

    status.innerHTML = "🟡 Connecting...";
    message("Opening Bluetooth selector...");

   connection = await WebBleConnection.open();

if (!connection) {
  throw new Error("No Bluetooth device selected");
}

connection.on("connected", async () => {

  status.innerHTML = "🟢 Connected";
  message("MeshCore radio connected.");

  advertBtn.disabled = false;
  floodBtn.disabled = false;

  connectBtn.innerHTML = "CONNECTED";
  connectBtn.disabled = true;

  repeatersBtn.disabled = false;

installDiscoveryListener();
installRoomListener();
installRoomMessageListener();


  roomBtn.disabled = false
  readRoomBtn.disabled = false;

});

connection.on("disconnected", () => {

  status.innerHTML = "🔴 Disconnected";

  advertBtn.disabled = true;
  floodBtn.disabled = true;

  connectBtn.innerHTML = "CONNECT TO RADIO";
  connectBtn.disabled = false;

  message("Radio disconnected.");

  repeatersBtn.disabled = true;
  roomBtn.disabled = true;
  readRoomBtn.disabled = true;

});

  }
  catch(err) {

    console.error(err);

    status.innerHTML = "🔴 Connection failed";
    message("Error: " + err);

  }

};


advertBtn.onclick = async () => {

  try {

    message("Sending local advert...");

    await connection.sendZeroHopAdvert();

    message("✅ Local advert sent.");

  }
  catch(err) {

    console.error(err);
    message("Advert error: " + err);

  }

};


floodBtn.onclick = async () => {

  try {

    message("Sending flood advert...");

    await connection.sendFloodAdvert();

    message("✅ Flood advert sent.");

  }
  catch(err) {

    console.error(err);
    message("Flood advert error: " + err);

  }

};

repeatersBtn.onclick = async () => {

  try {

    discoveredRepeaters = [];

    repeatersList.innerHTML =
      "<h3>Scanning zero-hop...</h3>" +
      "<p>Listening for nearby repeaters.</p>";

    message("Sending zero-hop repeater discovery...");

    // random 32-bit discovery tag
    discoveryTag =
      Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;

    /*
      Companion command:

      byte 0 = 0x37   CMD_SEND_CONTROL_DATA
      byte 1 = 0x00   flags
      byte 2 = 0x80   NODE_DISCOVER_REQ
      byte 3 = 0x04   filter bit for ADV_TYPE_REPEATER (type 2)
      bytes 4-7 = random discovery tag
      bytes 8-11 = "since", zero
    */

    const frame = new Uint8Array([
      0x37,
      0x00,
      0x80,
      0x04,
      ...uint32ToLE(discoveryTag),
      0x00, 0x00, 0x00, 0x00
    ]);

    await connection.sendToRadioFrame(frame);

    message("📡 Discovery transmitted. Listening...");

    if (discoveryTimer) {
      clearTimeout(discoveryTimer);
    }

    discoveryTimer = setTimeout(() => {

      if (discoveredRepeaters.length === 0) {

        repeatersList.innerHTML =
          "<h3>⚠️ NO NEARBY REPEATER HEARD</h3>" +
          "<p>No zero-hop repeater replied.</p>";

        message("Discovery finished — no repeater heard.");

      } else {

        message(
          "✅ Discovery finished — " +
          discoveredRepeaters.length +
          " repeater(s) heard."
        );

      }

    }, 7000);

  }

  catch(err) {

    console.error(err);

    repeatersList.innerHTML =
      "<pre>" + String(err) + "</pre>";

    message("Discovery error: " + err);

  }

};

roomBtn.onclick = async () => {

  try {

    roomStatus.innerHTML = "Finding room...";
    message("Looking for check-in room...");

    const contacts = await connection.getContacts();

    const room = contacts.find(c =>
      c.advName === CHECKIN_ROOM_NAME &&
      c.type === 3
      
    );
currentRoom = room;

    if (!room) {
      throw new Error(
        "Room '" + CHECKIN_ROOM_NAME + "' not found."
      );
    }

   roomStatus.innerHTML =
  "📡 Connecting to " + room.advName + "...";

message("Requesting full retained room history...");

const publicKey = Uint8Array.from(
  Object.values(room.publicKey)
);

const password =
  new TextEncoder().encode(CHECKIN_ROOM_PASSWORD);

/*
  CMD_SEND_ANON_REQ = 57 = 0x39

  Companion adds the sender timestamp itself.

  We provide:
    sync_since = 0
    password
*/

const frame =
  new Uint8Array(
    1 +               // command
    32 +              // room public key
    4 +               // sync_since
    password.length
  );

let pos = 0;

frame[pos++] = 0x39;

// Room public key
frame.set(publicKey, pos);
pos += 32;

// sync_since = 0
frame[pos++] = 0x00;
frame[pos++] = 0x00;
frame[pos++] = 0x00;
frame[pos++] = 0x00;

// password
frame.set(password, pos);

await connection.sendToRadioFrame(frame);

roomStatus.innerHTML =
  "⏳ Request sent — loading retained history...";

message(
  "Requested room history from beginning."
);

  }

  catch(err) {

    console.error(err);

    roomStatus.innerHTML =
      "❌ " + String(err);

    message("Room error: " + err);

  }

};
function readUint32LE(bytes, offset) {
  return (
    bytes[offset] |
    (bytes[offset + 1] << 8) |
    (bytes[offset + 2] << 16) |
    (bytes[offset + 3] << 24)
  ) >>> 0;
}

function decodeText(bytes) {
  return new TextDecoder("utf-8").decode(bytes);
}

async function requestNextMessage() {
  // CMD_SYNC_NEXT_MESSAGE = 0x0A
  await connection.sendToRadioFrame(
    new Uint8Array([0x0A])
  );
}

function installRoomMessageListener() {

  connection.txCharacteristic.addEventListener(
    "characteristicvaluechanged",
    async (event) => {

      const frame =
        new Uint8Array(event.target.value.buffer);

      // PUSH_CODE_MSG_WAITING
      // Radio says there is a queued message waiting.
      if (frame[0] === 0x83) {

        console.log("Message waiting");

        await requestNextMessage();

        return;
      }


      /*
        RESP_CODE_CONTACT_MSG_RECV_V3 = 16

        layout:

        0      response code
        1      SNR * 4
        2-3    reserved
        4-9    sender public-key prefix
        10     path length
        11     text type
        12-15  timestamp
        16...  message

        Room posts use SIGNED_PLAIN and include
        an additional four-byte author prefix before
        the actual text.
      */

      if (frame[0] === 16) {

        const snr =
          (frame[1] << 24 >> 24) / 4;

        const senderPrefix =
          bytesToHex(frame.slice(4, 10));

        const pathLen = frame[10];

        const txtType = frame[11];

        const timestamp =
          readUint32LE(frame, 12);

        let textStart = 16;

        let authorPrefix = null;

        /*
          Signed room posts contain an extra
          4-byte author public-key prefix.
        */
        if (txtType === 2) {

          authorPrefix =
            bytesToHex(frame.slice(16, 20));

          textStart = 20;
        }

        const text =
          decodeText(frame.slice(textStart));

        console.log(
          "ROOM MESSAGE:",
          {
            senderPrefix,
            authorPrefix,
            timestamp,
            snr,
            pathLen,
            txtType,
            text
          }
        );

        roomPosts.push({
          senderPrefix,
          authorPrefix,
          timestamp,
          snr,
          text
        });

        displayRoomPosts();

        // Keep draining the queue
        await requestNextMessage();

        return;
      }


      // RESP_CODE_NO_MORE_MESSAGES
      if (frame[0] === 10) {

        message(
          "✅ Room message sync complete."
        );

        if (roomPosts.length === 0) {

          roomMessages.innerHTML =
            "<p>No unread room messages.</p>";

        }

        return;
      }

    }
  );
}


function displayRoomPosts() {

  let html =
    "<h3>Room Messages</h3>";

  roomPosts.forEach(post => {

    const when =
      new Date(
        post.timestamp * 1000
      ).toLocaleString();

    html +=
      "<div style='" +
      "padding:12px;" +
      "border-bottom:1px solid #444;" +
      "text-align:left;" +
      "'>";

    html +=
      "<strong>" +
      when +
      "</strong>";

    if (post.authorPrefix) {

      html +=
        "<br><small>" +
        "Sender: " +
        post.authorPrefix +
        "</small>";

    }

    html +=
      "<br><br>" +
      post.text;

    html +=
      "</div>";

  });

  roomMessages.innerHTML = html;

}

readRoomBtn.onclick = async () => {

  try {

    roomPosts = [];

    roomMessages.innerHTML =
      "<p>Checking room...</p>";

    message(
      "Reading room messages..."
    );

    await requestNextMessage();

  }

  catch(err) {

    console.error(err);

    roomMessages.innerHTML =
      "<pre>" +
      String(err) +
      "</pre>";

    message(
      "Read room error: " +
      err
    );

  }

};

function installRoomListener() {

  connection.txCharacteristic.addEventListener(
    "characteristicvaluechanged",
    (event) => {

      const frame =
        new Uint8Array(event.target.value.buffer);

      console.log("RX:", frame);

      // PUSH_CODE_LOGIN_SUCCESS
      if (frame[0] === 0x85) {

        const permissions = frame[1];
        sendRoomPostBtn.disabled = false;
        roomStatus.innerHTML =
          "✅ CONNECTED TO " +
          CHECKIN_ROOM_NAME +
          "<br><small>Permission: " +
          permissions +
          "</small>";

        message(
          "Room login successful."
        );

        return;
      }


      // PUSH_CODE_LOGIN_FAIL
      if (frame[0] === 0x86) {

        roomStatus.innerHTML =
          "❌ ROOM NOT REACHED";

        message(
          "Room login failed or timed out."
        );

      }

    }
  );
}

function uint32ToLEBytes(value) {
  return new Uint8Array([
    value & 0xff,
    (value >>> 8) & 0xff,
    (value >>> 16) & 0xff,
    (value >>> 24) & 0xff
  ]);
}

sendRoomPostBtn.onclick = async () => {

  try {

    const text =
      roomPostText.value.trim();

    if (!text) {
      sendRoomStatus.innerHTML =
        "Type a message first.";
      return;
    }

    if (!currentRoom) {
      throw new Error(
        "Room has not been selected."
      );
    }

    const roomKey =
      Uint8Array.from(
        Object.values(currentRoom.publicKey)
      );

    const recipientPrefix =
      roomKey.slice(0, 6);

    const textBytes =
      new TextEncoder().encode(text);

    const timestamp =
      Math.floor(Date.now() / 1000);

    /*
      CMD_SEND_TXT_MSG

      byte 0    = 0x02
      byte 1    = txt_type 0 = plain text
      byte 2    = attempt 0
      bytes 3-6 = timestamp
      bytes 7-12 = first 6 bytes of room public key
      bytes 13+ = message
    */

    const frame =
      new Uint8Array(
        13 + textBytes.length
      );

    frame[0] = 0x02;
    frame[1] = 0x00;
    frame[2] = 0x00;

    frame.set(
      uint32ToLEBytes(timestamp),
      3
    );

    frame.set(
      recipientPrefix,
      7
    );

    frame.set(
      textBytes,
      13
    );

    sendRoomStatus.innerHTML =
      "📡 Sending...";

    await connection.sendToRadioFrame(frame);

    sendRoomStatus.innerHTML =
      "✅ Message handed to radio.";

    roomPostText.value = "";

  }

  catch(err) {

    console.error(err);

    sendRoomStatus.innerHTML =
      "❌ " + String(err);

  }

};

</script>

</body>
</html>
