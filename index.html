zoomInBtn.onclick = () => {

  const factor = 0.75;

  const newWidth = mapView.width * factor;
  const newHeight = mapView.height * factor;

  mapView.x += (mapView.width - newWidth) / 2;
  mapView.y += (mapView.height - newHeight) / 2;

  mapView.width = newWidth;
  mapView.height = newHeight;

  applyMapView();
};


zoomOutBtn.onclick = () => {

  const factor = 1.33;

  const newWidth = mapView.width * factor;
  const newHeight = mapView.height * factor;

  mapView.x -= (newWidth - mapView.width) / 2;
  mapView.y -= (newHeight - mapView.height) / 2;

  mapView.width = Math.min(newWidth, 500);
  mapView.height = Math.min(newHeight, 620);

  if (mapView.width === 500) mapView.x = 0;
  if (mapView.height === 620) mapView.y = 0;

  applyMapView();
};

function uint32ToLE(value) {
  return [
    value & 0xff,
    (value >> 8) & 0xff,
    (value >> 16) & 0xff,
    (value >> 24) & 0xff
  ];
}

function bytesToHex(bytes) {
  return Array.from(bytes)
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}


function installDiscoveryListener() {

  connection.txCharacteristic.addEventListener(
    "characteristicvaluechanged",
    (event) => {

      const frame = new Uint8Array(event.target.value.buffer);

      // 0x8E = PUSH_CODE_CONTROL_DATA
      if (frame[0] !== 0x8E) return;

      const localSnr = (frame[1] << 24 >> 24) / 4;
      const localRssi = frame[2] << 24 >> 24;

      const pathLen = frame[3];

      const payloadStart = 4 + pathLen;
      const payload = frame.slice(payloadStart);

      if (payload.length < 6) return;

      // upper nibble 0x90 = DISCOVER_RESP
      const responseType = payload[0] & 0xF0;

      if (responseType !== 0x90) return;

      // lower nibble is node type
      const nodeType = payload[0] & 0x0F;

      // 2 = repeater
      if (nodeType !== 2) return;

      const remoteSnr = (payload[1] << 24 >> 24) / 4;

      const responseTag =
        payload[2] |
        (payload[3] << 8) |
        (payload[4] << 16) |
        (payload[5] << 24);

      // only accept replies to OUR discovery request
      if ((responseTag >>> 0) !== (discoveryTag >>> 0)) return;

      const pubKey = payload.slice(6);

      const pubKeyHex = bytesToHex(pubKey);

      // avoid duplicate responders
      if (discoveredRepeaters.some(r => r.pubKey === pubKeyHex)) {
        return;
      }

      discoveredRepeaters.push({
        pubKey: pubKeyHex,
        localSnr,
        localRssi,
        remoteSnr
      });

      showDiscoveryResults();
    }
  );
}
function showDiscoveryResults() {

  if (discoveredRepeaters.length === 0) {
    repeatersList.innerHTML =
      "<h3>Scanning...</h3><p>No repeater replies yet.</p>";
    return;
  }

  let html =
    "<h3>✅ " +
    discoveredRepeaters.length +
    " nearby repeater" +
    (discoveredRepeaters.length === 1 ? "" : "s") +
    " found</h3>";

  discoveredRepeaters.forEach((r, i) => {

    html +=
      "<div style='padding:12px;border-bottom:1px solid #444;text-align:left;'>" +
      "<strong>Repeater " + (i + 1) + "</strong>" +
      "<br>Radio SNR: " + r.localSnr + " dB" +
      "<br>Repeater heard us: " + r.remoteSnr + " dB" +
      "<br>RSSI: " + r.localRssi + " dBm" +
      "<br><small>" + r.pubKey.substring(0, 16) + "...</small>" +
      "</div>";
  });

  repeatersList.innerHTML = html;
}

      Companion command:

      byte 0 = 0x37   CMD_SEND_CONTROL_DATA
      byte 1 = 0x00   flags

function readUint32LE(bytes, offset) {
  return (
    bytes[offset] |
    (bytes[offset + 1] << 8) |
    (bytes[offset + 2] << 16) |
    (bytes[offset + 3] << 24)
  ) >>> 0;
}

function decodeText(bytes) {
  return new TextDecoder("utf-8").decode(bytes);
}

async function requestNextMessage() {
  // CMD_SYNC_NEXT_MESSAGE = 0x0A
  await connection.sendToRadioFrame(
    new Uint8Array([0x0A])
  );
}

function installRoomMessageListener() {

  connection.txCharacteristic.addEventListener(
    "characteristicvaluechanged",
    async (event) => {

      const frame =
        new Uint8Array(event.target.value.buffer);

      // PUSH_CODE_MSG_WAITING
      // Radio says there is a queued message waiting.
      if (frame[0] === 0x83) {

        console.log("Message waiting");

        await requestNextMessage();

        return;
      }


      /*
        RESP_CODE_CONTACT_MSG_RECV_V3 = 16

        layout:

        0      response code
        1      SNR * 4
        2-3    reserved
        4-9    sender public-key prefix
        10     path length
        11     text type
        12-15  timestamp
        16...  message

        Room posts use SIGNED_PLAIN and include
        an additional four-byte author prefix before
        the actual text.
      */

      if (frame[0] === 16) {

        const snr =
          (frame[1] << 24 >> 24) / 4;

        const senderPrefix =
          bytesToHex(frame.slice(4, 10));

        const pathLen = frame[10];

        const txtType = frame[11];

        const timestamp =
          readUint32LE(frame, 12);

        let textStart = 16;

        let authorPrefix = null;

        /*
          Signed room posts contain an extra
          4-byte author public-key prefix.
        */
        if (txtType === 2) {

          authorPrefix =
            bytesToHex(frame.slice(16, 20));

          textStart = 20;
        }

        const text =
          decodeText(frame.slice(textStart));

        console.log(
          "ROOM MESSAGE:",
          {
            senderPrefix,
            authorPrefix,
            timestamp,
            snr,
            pathLen,
            txtType,
            text
          }
        );

        roomPosts.push({
          senderPrefix,
          authorPrefix,
          timestamp,
          snr,
          text
        });

        displayRoomPosts();

        // Keep draining the queue
        await requestNextMessage();

        return;
      }


      // RESP_CODE_NO_MORE_MESSAGES
      if (frame[0] === 10) {

        message(
          "✅ Room message sync complete."
        );

        if (roomPosts.length === 0) {

          roomMessages.innerHTML =
            "<p>No unread room messages.</p>";

        }

        return;
      }

    }
  );
}

function uint32ToLEBytes(value) {
  return new Uint8Array([
    value & 0xff,
    (value >>> 8) & 0xff,
    (value >>> 16) & 0xff,
    (value >>> 24) & 0xff
  ]);
}

sendRoomPostBtn.onclick = async () => {

  try {

    const text =
      roomPostText.value.trim();

    if (!text) {
      sendRoomStatus.innerHTML =
        "Type a message first.";
      return;
    }

    if (!currentRoom) {
      throw new Error(
        "Room has not been selected."
      );
    }

    const roomKey =
      Uint8Array.from(
        Object.values(currentRoom.publicKey)
      );

    const recipientPrefix =
      roomKey.slice(0, 6);

    const textBytes =
      new TextEncoder().encode(text);

    const timestamp =
      Math.floor(Date.now() / 1000);

    /*
      CMD_SEND_TXT_MSG

      byte 0    = 0x02
      byte 1    = txt_type 0 = plain text
      byte 2    = attempt 0
      bytes 3-6 = timestamp
      bytes 7-12 = first 6 bytes of room public key
      bytes 13+ = message
    */

    const frame =
      new Uint8Array(
        13 + textBytes.length
      );

    frame[0] = 0x02;
    frame[1] = 0x00;
    frame[2] = 0x00;

    frame.set(
      uint32ToLEBytes(timestamp),
      3
    );

    frame.set(
      recipientPrefix,
      7
    );

    frame.set(
      textBytes,
      13
    );

    sendRoomStatus.innerHTML =
      "📡 Sending...";

    await connection.sendToRadioFrame(frame);

    sendRoomStatus.innerHTML =
      "✅ Message handed to radio.";

    roomPostText.value = "";

  }

  catch(err) {

    console.error(err);

    sendRoomStatus.innerHTML =
      "❌ " + String(err);

  }

};

function toRadians(deg) {
  return deg * Math.PI / 180;
}

function toDegrees(rad) {
  return rad * 180 / Math.PI;
}


function distanceMiles(lat1, lon1, lat2, lon2) {

  const R = 3958.8;

  const dLat =
    toRadians(lat2 - lat1);

  const dLon =
    toRadians(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRadians(lat1)) *
    Math.cos(toRadians(lat2)) *
    Math.sin(dLon / 2) ** 2;

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


function bearingDegrees(lat1, lon1, lat2, lon2) {

  const φ1 = toRadians(lat1);
  const φ2 = toRadians(lat2);

  const λ1 = toRadians(lon1);
  const λ2 = toRadians(lon2);

  const y =
    Math.sin(λ2 - λ1) *
    Math.cos(φ2);

  const x =
    Math.cos(φ1) *
    Math.sin(φ2) -
    Math.sin(φ1) *
    Math.cos(φ2) *
    Math.cos(λ2 - λ1);

  return (
    toDegrees(Math.atan2(y, x)) + 360
  ) % 360;
}


function bearingName(deg) {

  const directions = [
    "N",
    "NE",
    "E",
    "SE",
    "S",
    "SW",
    "W",
    "NW"
  ];

  return directions[
    Math.round(deg / 45) % 8
  ];
}

const GA_BOUNDS = {
  north: 35.05,
  south: 30.35,
  west: -85.65,
  east: -80.75
};


function geoToMap(lat, lon) {

  const x =
    ((lon - GA_BOUNDS.west) /
    (GA_BOUNDS.east - GA_BOUNDS.west))
    * 500;

  const y =
    ((GA_BOUNDS.north - lat) /
    (GA_BOUNDS.north - GA_BOUNDS.south))
    * 620;

  return { x, y };
}

  innerCircle.setAttribute("stroke", "#333");
  innerCircle.setAttribute("stroke-width", "1");

  gaMap.appendChild(innerCircle);


  // North marker
  const north =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

  north.setAttribute("x", "250");
  north.setAttribute("y", "22");
  north.setAttribute("text-anchor", "middle");
  north.setAttribute("fill", "#aaa");
  north.setAttribute("font-size", "18");

  north.textContent = "N";

  gaMap.appendChild(north);


  // User in center
  const userCircle =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  userCircle.setAttribute("cx", "250");
  userCircle.setAttribute("cy", "250");
  userCircle.setAttribute("r", "9");
  userCircle.setAttribute("fill", "#00aaff");

  gaMap.appendChild(userCircle);


  // Only show repeaters within radius
  const nearby =
    repeaters.filter(
      r => r.distance <= LOCAL_RADIUS_MILES
    );


  nearby.forEach(r => {

    /*
      Convert distance+bearing into map coordinates.

      220 pixels = LOCAL_RADIUS_MILES
    */

    const distanceRatio =
      r.distance / LOCAL_RADIUS_MILES;

    const pixelDistance =
      distanceRatio * 220;

    const angle =
      toRadians(r.bearing);

    const x =
      250 +
      Math.sin(angle) *
      pixelDistance;

    const y =
      250 -
      Math.cos(angle) *
      pixelDistance;


    const dot =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    dot.setAttribute("cx", x);
    dot.setAttribute("cy", y);
    dot.setAttribute("r", "7");
    dot.setAttribute("fill", "#aaa");

    gaMap.appendChild(dot);


    // Repeater label

    const label =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
      );

    label.setAttribute("x", x + 10);
    label.setAttribute("y", y - 8);
    label.setAttribute("fill", "#ddd");
    label.setAttribute("font-size", "12");

    label.textContent =
      r.name +
      " " +
      r.distance.toFixed(1) +
      " mi";

    gaMap.appendChild(label);

  });


  // Radius label

  const radiusLabel =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

  radiusLabel.setAttribute("x", "250");
  radiusLabel.setAttribute("y", "488");
  radiusLabel.setAttribute("text-anchor", "middle");
  radiusLabel.setAttribute("fill", "#777");
  radiusLabel.setAttribute("font-size", "12");

  radiusLabel.textContent =
    LOCAL_RADIUS_MILES +
    " mile radius";

  gaMap.appendChild(radiusLabel);

}


mapRepeatersBtn.onclick = async () => {

  try {

    mapPanel.style.display = "none";

    gpsStatus.innerHTML =
      "Reading repeater locations...";

    const contacts =
      await connection.getContacts();


    const repeaters =
      contacts
        .filter(c => {

          if (c.type !== 2)
            return false;

          if (!c.advLat || !c.advLon)
            return false;

          return true;

        })
        .map(c => {

          return {

            name:
              c.advName ||
              "Unnamed repeater",

            lat:
              c.advLat / 1000000,

            lon:
              c.advLon / 1000000,

            lastAdvert:
              c.lastAdvert

          };

        });


    if (repeaters.length === 0) {

      gpsStatus.innerHTML =
        "No repeaters with coordinates found.";

      return;

    }


    gpsStatus.innerHTML =
      "Getting iPhone location...";


    navigator.geolocation.getCurrentPosition(

      position => {

        const userLat =
          position.coords.latitude;

        const userLon =
          position.coords.longitude;


        repeaters.forEach(r => {

          r.distance =
            distanceMiles(
              userLat,
              userLon,
              r.lat,
              r.lon
            );

          r.bearing =
            bearingDegrees(
              userLat,
              userLon,
              r.lat,
              r.lon
            );

        });


        repeaters.sort(
          (a, b) =>
            a.distance - b.distance
        );


        const nearbyRepeaters =
          repeaters.filter(
            r => r.distance <= LOCAL_RADIUS_MILES
          );

        gpsStatus.innerHTML =
          "📍 " +
          nearbyRepeaters.length +
          " known repeaters within " +
          LOCAL_RADIUS_MILES +
          " miles.";


        drawLocalRepeaterMap(
          userLat,
          userLon,
          repeaters
        );
        mapPanel.style.display = "block";


        let html =
          "<h3>Nearest Repeaters</h3>";


        repeaters
         .filter(r => r.distance <= LOCAL_RADIUS_MILES)
          .slice(0, 10)

          


          .forEach((r, index) => {

            const direction =
              bearingName(r.bearing);

            const lastSeen =
              r.lastAdvert
                ? new Date(
                    r.lastAdvert * 1000
                  ).toLocaleDateString()
                : "Unknown";


            html += `
              <div style="
                padding:12px;
                border-bottom:1px solid #444;
                text-align:left;
              ">

                <strong>
                  ${index + 1}. ${r.name}
                </strong>

                <br>

                ${r.distance.toFixed(1)}
                miles

                ${direction}

                (${Math.round(r.bearing)}°)

                <br>

                <small>
                  Last advert:
                  ${lastSeen}
                </small>

              </div>
            `;

          });


        nearestRepeaters.innerHTML =
          html;

      },

      error => {

        console.error(error);

        gpsStatus.innerHTML =
          "❌ GPS error: " +
          error.message;

      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 30000
      }

    );

  }

  catch(err) {

    console.error(err);

    gpsStatus.innerHTML =
      "❌ " + String(err);

  }

};

async function resetContactPath(contact) {

  const publicKey =
    Uint8Array.from(
      Object.values(contact.publicKey)
    );

  const frame =
    new Uint8Array(1 + 32);

  frame[0] = 0x0D; // CMD_RESET_PATH

  frame.set(publicKey, 1);

  await connection.sendToRadioFrame(frame);
}


async function requestBattery() {

  await connection.sendToRadioFrame(
    new Uint8Array([0x14])
  );

}

function installBatteryListener() {

  connection.txCharacteristic.addEventListener(
    "characteristicvaluechanged",
    (event) => {

      const frame =
        new Uint8Array(event.target.value.buffer);

      if (frame[0] !== 0x0C)
        return;

      console.log("BATTERY FRAME:", Array.from(frame));

      batteryStatus.innerHTML =
        "Battery frame: " +
        Array.from(frame).join(", ");

    }
  );

}
