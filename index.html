<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#06131f">
    <title>MeshKin</title>

    <!-- ==================== STYLES / VISUAL DESIGN ==================== -->
  <style>
  /* ---------- Theme variables ---------- */
    :root {
      --bg: #020b13;
      --panel: #071827;
      --panel-2: #0a2032;
      --panel-3: #0c2740;
      --line: #234762;
      --line-soft: rgba(92, 157, 205, .22);
      --text: #f5f9ff;
      --muted: #9ab6cb;
      --blue: #178bff;
      --blue-2: #57b3ff;
      --green: #35d67a;
      --green-deep: #0d8f4d;
      --danger: #ff6b6b;
      --shadow: 0 18px 50px rgba(0,0,0,.28);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
      radial-gradient(circle at 50% -10%, rgba(39, 121, 180, .22), transparent 32rem),
      linear-gradient(180deg, #05121d 0%, #020a12 100%);
      color: var(--text);
    }

    button, textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding:
      max(5px, env(safe-area-inset-top))
      5px
      max(5px, env(safe-area-inset-bottom));
    }

  /* ---------- Header / branding ---------- */
    .brand {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
    }

    .brand-mesh {
      color: #ffffff;
    }

    .brand-kin {
      background: linear-gradient(
      135deg,
      #39b9ff,
      #087cff
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.1px;
      color: #6f8798;
    }

    .gear {
      position: absolute;
      right: 3px;
      top: 3px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #7fc4f4;
      font-size: 28px;
      display: grid;
      place-items: center;
      padding: 0;
    }

  /* ---------- Top connection / mesh / battery status ---------- */
    .status-strip {
      display: grid;
      grid-template-columns: 1.2fr 1.5fr 0.8fr;
      border: 1px solid var(--line);
      background: rgba(8, 26, 41, .92);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.015);
      margin-bottom: 3px;
    }

    .status-card {
      min-width: 0;
      padding: 15px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .status-card + .status-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18%;
      height: 64%;
      width: 1px;
      background: var(--line-soft);
    }

    .status-icon {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      font-size: 21px;
    }

    .status-icon.radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #48e882;
      box-shadow: 0 0 18px rgba(72,232,130,.35);
    }

    .status-icon.battery {
      border: 1px solid #7ba8c3;
      border-radius: 3px;
      width: 12px;
      height: 22px;
      position: relative;
      padding: 3px;
    }

    .status-icon.battery::before {
      content: "";
      position: absolute;
      width: 6px;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: #7ba8c3;
      left: 2px;
      top: -4px;
    }

    .status-icon.battery::after {
      content: "";
      width: 100%;
      height: 74%;
      align-self: end;
      background: linear-gradient(180deg, #5bea8b, #26c96d);
      border-radius: 1px;
    }

    .status-icon.mesh {
      color: var(--green);
      background: rgba(53,214,122,.08);
      font-size: 25px;
    }

    .status-copy {
      min-width: 0;
    }

    .status-value {
      color: white;
      font-weight: 750;
      font-size: 17px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-value.connecting { color: #ffd36e; }
    .status-value.disconnected { color: #ff8d8d; }

    .status-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-panel {
      background: linear-gradient(180deg, rgba(67,114,76,.96), rgba(5,20,33,.98));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

  /* ---------- Local map panel ---------- */
    .map-shell {
      height: min(43vh, 390px);
      min-height: 290px;
      position: relative;
      background:
      radial-gradient(circle at 50% 52%, rgba(18,121,210,.18), transparent 24%),
      linear-gradient(135deg, rgba(38,74,93,.20) 1px, transparent 1px) 0 0/38px 38px,
      linear-gradient(45deg, rgba(31,65,84,.16) 1px, transparent 1px) 0 0/38px 38px,
      #071b2a;
    }

    .map-shell::before,
    .map-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .map-shell::before {
      background:
      linear-gradient(18deg, transparent 39%, rgba(91,127,147,.30) 40%, rgba(91,127,147,.30) 41%, transparent 42%),
      linear-gradient(132deg, transparent 44%, rgba(91,127,147,.20) 45%, rgba(91,127,147,.20) 46%, transparent 47%),
      linear-gradient(82deg, transparent 52%, rgba(91,127,147,.18) 53%, rgba(91,127,147,.18) 54%, transparent 55%);
      opacity: .7;
    }

    .map-topbar {
      position: absolute;
      top: 6px;
      left: 14px;
      right: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      border-radius: 14px;
      background: rgba(2,12,20,.83);
      border: 1px solid rgba(97,157,194,.18);
    }

    .segmented span {
      min-width: 50px;
      text-align: center;
      padding: 5px 10px;
      border-radius: 7px;
      color: #8faec5;
      font-weight: 650;
      font-size: 12px;
    }

    .segmented .active {
      color: #fff;
      background: linear-gradient(180deg, #1c99ff, #0c79eb);
      box-shadow: 0 6px 18px rgba(10,126,238,.28);
    }

    .locate {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      /* border: 2px solid #dcefff;
      background: rgba(4,15,24,.72); */
      display: grid;
      place-items: center;
      color: white;
      font-size: 12px;
    }

    #mapPanel {
      display: block !important;
      position: absolute !important;
      inset: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      border: 0 !important;
      border-radius: 0 !important;
      z-index: 1;
    }

    #gaMap {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      inset: 0;
    }

    #nearestRepeaters {
      display: none;
    }

    #gpsStatus {
      position: absolute;
      left: 18px;
      bottom: 14px;
      z-index: 3;
      padding: 8px 11px;
      border-radius: 12px;
      background: rgba(3,13,22,.74);
      color: #d9ecfa;
      font-size: 12px;
      backdrop-filter: blur(8px);
      max-width: calc(100% - 36px);
    }

    .map-radius {
      position: absolute;
      right: 16px;
      bottom: 14px;
      z-index: 3;
      color: #c6dbe9;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(3,13,22,.74);
      backdrop-filter: blur(8px);
    }

  /* ---------- Check-In chat panel ---------- */
    .messages {
      margin-top: 3px;
      display: flex;
      flex-direction: column;
      height: 150px;
    }

    .messages-head {
      padding: 10px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(89,139,170,.16);
      background: rgba(2,11,18,.35);
    }

    .messages-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: -.6px;
    }

    .room-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(55,99,131,.20);
      border: 1px solid rgba(101,158,195,.25);
      color: #b9d0df;
      font-size: 12px;
      white-space: nowrap;
    }

    .room-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(53,214,122,.35);
    }

    #roomMessages {
      flex: 1;
      min-height: 50px;
      max-height: 150px;
      overflow-y: auto;
      padding: 10px 16px 10px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .message-row.outgoing {
      justify-content: flex-end;
    }

    .avatar {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #55b6ff, #2c88e7);
      color: white;
      font-weight: 750;
      font-size: 12px;
      margin-top: 18px;
    }

    .message-stack {
      max-width: min(78%, 520px);
    }

    .message-row.outgoing .message-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .message-meta {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 5px 5px;
      font-size: 13px;
      color: #96b2c6;
    }

    .message-meta span {
      color: #f6fbff;
      font-weight: 700;
      font-size: 14px;
    }

    .bubble {
      background: linear-gradient(180deg, #29435c, #20384e);
      color: white;
      border-radius: 18px 18px 18px 6px;
      padding: 11px 14px;
      font-size: 16px;
      line-height: 1.35;
      text-align: left;
      word-break: break-word;
    }

    .message-row.outgoing .bubble {
      background: linear-gradient(180deg, #168dff, #0876eb);
      border-radius: 18px 18px 6px 18px;
    }

    .empty-chat {
      color: #8ba8bd;
      text-align: center;
      padding: 34px 16px;
      font-size: 14px;
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr 58px;
      gap: 10px;
      align-items: end;
      padding: 10px;
      border-top: 1px solid rgba(89,139,170,.16);
      background: rgba(2,11,18,.35);
    }

    #roomPostText {
      width: 100%;
      min-height: 30px;
      max-height: 60px;
      resize: vertical;
      border: 1px solid #28506b;
      outline: none;
      border-radius: 14px;
      background: #081d2d;
      color: white;
      padding: 10px 10px;
      font-size: 12px;
      line-height: 1.35;
    }

    #roomPostText::placeholder {
      color: #7393aa;
    }

    #roomPostText:focus {
      border-color: #3da2e8;
      box-shadow: 0 0 0 3px rgba(61,162,232,.10);
    }

    #sendRoomPost {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      margin: 0;
      padding: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #39dc7d, #21b960);
      color: white;
      box-shadow: 0 10px 25px rgba(27,181,93,.24);
      font-size:15px;
    }

    #sendRoomPost:disabled {
      opacity: .35;
      box-shadow: none;
    }

    #sendRoomStatus {
      min-height: 16px;
      padding: 0 18px 10px;
      color: #8fb2c8;
      font-size: 12px;
      text-align: right;
    }

    .technical {
      display: none !important;
    }

    #log, #roomStatus, #repeatersList {
      display: none;
    }

    @media (max-width: 430px) {
      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

  /* ---------- Header / branding ---------- */
    .brand {
      padding-bottom: 15px;
    }

    .status-card {
      padding: 13px 8px;
      gap: 7px;
    }

    .status-value {
      font-size: 13px;
    }

    .status-sub {
      font-size: 10px;
    }

  /* ---------- Local map panel ---------- */
    .map-shell {
      min-height: 270px;
      height: 39vh;
    }

  /* ---------- Check-In chat panel ---------- */
    .messages {
      min-height: 250px;
    }
    }


  /* ---------- Map / List / Family tabs ---------- */
    .segmented button {
      border: 0;
      background: transparent;
      color: #8faec5;
      min-width: 50px;
      padding: 4px 6px;
      border-radius: 12px;
      font-weight: 650;
      font-size: 12px;
      margin: 0;
    }

    .segmented button.active {
      color: #fff;
      background: linear-gradient(180deg, #1081de, #0960bd);
      box-shadow: 0 6px 18px rgba(10,126,238,.28);
    }

    #localRepeaterList {
      position: absolute;
      inset: 50px 14px 14px;
      z-index: 2;
      overflow-y: auto;
      background: rgba(4,18,29,.92);
      border-radius: 14px;
      padding: 6px 14px;
    }

    .repeater-list-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 16px;
      align-items: center;
      padding: 15px 4px;
      border-bottom: 1px solid rgba(99,147,178,.18);
    }

    .repeater-list-row:last-child {
      border-bottom: 0;
    }

    .repeater-list-name {
      font-weight: 650;
      color: #fff;
      text-align: left;
    }

    .repeater-list-distance {
      color: #b7cfdf;
      white-space: nowrap;
    }

    .repeater-list-direction {
      color: #63baff;
      font-weight: 700;
      min-width: 28px;
      text-align: right;
    }

    .repeater-empty {
      padding: 40px 12px;
      text-align: center;
      color: #8faec5;
    }

  /* ---------- Family status list ---------- */
    #familyList {
      position: absolute;
      inset: 50px 14px 14px;
      z-index: 2;
      overflow-y: auto;
      background: rgba(4,18,29,.92);
      border-radius: 14px;
      padding: 6px 14px;
    }

    .family-row {
      display: grid;
      grid-template-columns: 12px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 5px 4px;
      border-bottom: 1px solid rgba(99,147,178,.18);
    }

    .family-row:last-child {
      border-bottom: 0;
    }

    .family-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #536674;
    }

    .family-dot.family-known {
      background: #42d77d;
      box-shadow: 0 0 8px rgba(66,215,125,.45);
    }

    .family-info {
      min-width: 0;
    }

    .family-name {
      color: #fff;
      font-weight: 650;
      text-align: left;
    }

    .family-time {
      color: #8faec5;
      font-size: 10px;
      margin-top: 1px;
      text-align: left;
    }

    .family-location {
      color: #63baff;
      font-weight: 650;
      font-size: 12px;
      white-space: nowrap;
      text-align: right;
    }

    .family-map-dot {
      fill: #ff9f43;
      stroke: #ffd09b;
      stroke-width: 2;
      filter: drop-shadow(0 0 6px rgba(255,159,67,.65));
    }

    .family-map-label {
      fill: #ffffff;
      font-size: 13px;
      font-weight: 700;
      paint-order: stroke;
      stroke: #07131d;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .family-map-detail {
      fill: #ffb86c;
      font-size: 10px;
      font-weight: 600;
      paint-order: stroke;
      stroke: #07131d;
      stroke-width: 3px;
      stroke-linejoin: round;
    }


  </style>
  </head>

  <!-- ==================== APP MARKUP / USER INTERFACE ==================== -->
  <body>
    <main class="app">

      <!-- Header / MeshKin branding -->
      <header class="brand">

        <span class="brand-mesh">Mesh</span><span class="brand-kin">Kin7</span>


        <div class="gear" aria-hidden="true">⚙</div>
      </header>

      <!-- Radio, mesh and battery status -->
      <section class="status-strip" aria-label="Radio status">
        <div class="status-card" id="radioStatusCard" role="button" tabindex="0" aria-label="Connect to radio">
          <div class="status-icon radio"></div>
          <div class="status-copy">
            <div id="status" class="status-value disconnected">Not connected</div>
            <div id="radioDeviceLabel" class="status-sub" >RadioName</div>
          </div>
        </div>



        <div class="status-card">
          <div class="status-icon mesh">⌁</div>
          <div class="status-copy">
            <div id="meshReadyMain" class="status-value">Mesh Ready</div>
            <div id="meshReadySub" class="status-sub">not checked yet</div>
          </div>
        </div>

        <div class="status-card">
          <div class="status-icon battery"></div>
          <div class="status-copy">
            <div id="batteryStatus" class="status-value">--%</div>

          </div>
        </div>

      </section>

      <!-- Map / repeater list / family location panel -->
      <section class="section-panel map-shell" aria-label="Nearby repeater map">
        <div class="map-topbar">
          <div class="segmented">
            <button id="mapTab" class="active" type="button">Map</button>
            <button id="listTab" type="button">List</button>
            <button id="familyTab" type="button">Family</button>
          </div>
          <div class="locate" aria-hidden="true">↻</div>
        </div>

        <div id="mapPanel">
          <svg id="gaMap" viewBox="0 0 500 500"></svg>
          <div id="nearestRepeaters"></div>
        </div>

        <div id="localRepeaterList" style="display:none;"></div>
        <div id="familyList" style="display:none;"></div>

        <div id="gpsStatus">Waiting for radio connection…</div>
        <div class="map-radius">5 mile radius</div>
      </section>

      <!-- Check-In room messages and composer -->
      <section class="section-panel messages" aria-label="Family messages">
        <div class="messages-head">
          <h2 class="messages-title">Check-In</h2>
          <div class="room-pill">
            <span class="room-dot"></span>
            <span id="familyStatus">Waiting</span>
          </div>
        </div>

        <div id="roomMessages">
          <div class="empty-chat">Waiting to connect to the family check-in room...</div>
        </div>

        <div class="composer">
          <textarea id="roomPostText" placeholder="Type a message..." rows="1"></textarea>
          <button id="sendRoomPost" disabled aria-label="Send message">➤</button>
        </div>
        <div id="sendRoomStatus"></div>
      </section>

      <!-- Working MeshCore controls kept in the DOM but hidden from the family interface. -->
      <div class="technical">
        <button id="connect">CONNECT TO RADIO</button>
        <button id="mapRepeaters" disabled>SHOW REPEATER MAP</button>
        <button id="advert" disabled>ADVERTISE LOCALLY</button>
        <button id="flood" disabled>FLOOD ADVERTISE</button>
        <button id="repeaters" disabled>FIND REPEATERS</button>
        <button id="room" disabled>CHECK IN ROOM</button>
        <button id="readRoom" disabled>READ ROOM</button>
        <button id="closeMap">CLOSE MAP</button>
        <button id="zoomIn">+</button>
        <button id="zoomOut">−</button>
        <button id="resetMap">RESET</button>
      </div>

      <div id="roomStatus"></div>
      <div id="repeatersList"></div>
      <div id="log">Ready.</div>

    </main>

    <!-- ==================== OFFLINE NORTH GEORGIA BASE MAP ==================== -->
  <script>
/*
  MeshKin Offline North Georgia Base Map v1
  -----------------------------------------
  Purpose: lightweight, completely offline geographic context for MeshKin.

  This file contains a simplified/schematic set of major-road centerlines and
  city labels from just south of Atlanta to the Tennessee/North Carolina line.
  Coordinates are intentionally reduced to keep the file small and fast on iPhone.

  IMPORTANT: This is a context map, not a turn-by-turn/navigation dataset.
  It is suitable for showing whether a repeater is generally near a major road,
  highway, town, or corridor. It should not be used as a substitute for an
  authoritative street map.
*/

window.NORTH_GEORGIA_BASEMAP = {
  version: "1.0",
  name: "North Georgia Offline Context Map",

  bounds: {
    south: 33.30,
    north: 35.02,
    west: -85.45,
    east: -82.95
  },

  roads: [
    {
      name: "I-75",
      class: "interstate",
      points: [
        [33.40,-84.90],[33.51,-84.91],[33.64,-84.45],[33.75,-84.39],
        [33.88,-84.46],[34.03,-84.59],[34.17,-84.74],[34.31,-84.84],
        [34.49,-84.95],[34.62,-85.00],[34.77,-85.00],[34.98,-85.05]
      ]
    },
    {
      name: "I-85",
      class: "interstate",
      points: [
        [33.45,-84.75],[33.57,-84.61],[33.75,-84.39],[33.85,-84.25],
        [33.96,-84.08],[34.05,-83.93],[34.15,-83.80],[34.29,-83.63],
        [34.43,-83.46],[34.57,-83.31],[34.70,-83.15]
      ]
    },
    {
      name: "I-20",
      class: "interstate",
      points: [
        [33.72,-85.18],[33.74,-84.93],[33.75,-84.70],[33.75,-84.39],
        [33.72,-84.17],[33.66,-83.93],[33.59,-83.72]
      ]
    },
    {
      name: "I-285",
      class: "interstate",

    function installDiscoveryListener() {

      connection.txCharacteristic.addEventListener(
      "characteristicvaluechanged",
      (event) => {

        const frame = new Uint8Array(event.target.value.buffer);

        // 0x8E = PUSH_CODE_CONTROL_DATA
        if (frame[0] !== 0x8E) return;

        const localSnr = (frame[1] << 24 >> 24) / 4;
        const localRssi = frame[2] << 24 >> 24;

        const pathLen = frame[3];

        const payloadStart = 4 + pathLen;
        const payload = frame.slice(payloadStart);

        if (payload.length < 6) return;

        // upper nibble 0x90 = DISCOVER_RESP
        const responseType = payload[0] & 0xF0;

        if (responseType !== 0x90) return;

        // lower nibble is node type
        const nodeType = payload[0] & 0x0F;

        // 2 = repeater
        if (nodeType !== 2) return;

        const remoteSnr = (payload[1] << 24 >> 24) / 4;

        const responseTag =
        payload[2] |
        (payload[3] << 8) |
        (payload[4] << 16) |
        (payload[5] << 24);

        // only accept replies to OUR discovery request
        if ((responseTag >>> 0) !== (discoveryTag >>> 0)) return;

        const pubKey = payload.slice(6);

        const pubKeyHex = bytesToHex(pubKey);

        // avoid duplicate responders
        if (discoveredRepeaters.some(r => r.pubKey === pubKeyHex)) {
          return;
        }

        discoveredRepeaters.push({
          pubKey: pubKeyHex,
          localSnr,
          localRssi,
          remoteSnr
        });

        showDiscoveryResults();
      }
      );

    async function requestNextMessage() {

      // NEXT_MESSAGE requests.
      if (roomRequestPending) return;

      roomRequestPending = true;

      try {
        await connection.sendToRadioFrame(
          new Uint8Array([0x0A])
        );

        console.error("ROOM SYNC request failed:", err);
        throw err;

    }

        Uint8Array.from(

let text =

let authorPrefix = null;

async function requestRoomHistory(room, since = 1) {

  const publicKey = Uint8Array.from(
    Object.values(room.publicKey)
  );

  /*
    CMD_SEND_BINARY_REQ = 50 / 0x32

    Frame:
      byte 0       command = 50
      bytes 1-32   room public key
      byte 33      REQ_TYPE_KEEP_ALIVE = 0x02
      bytes 34-37  forceSince uint32 LE
  */

  const frame = new Uint8Array(38);

  frame[0] = 0x32;

  frame.set(publicKey, 1);

  frame[33] = 0x02;

  frame[34] = since & 0xff;
  frame[35] = (since >>> 8) & 0xff;
  frame[36] = (since >>> 16) & 0xff;
  frame[37] = (since >>> 24) & 0xff;

  console.log(
    "ROOM: requesting history since",
    since
  );

  await connection.sendToRadioFrame(frame);
}

  // ==================== DISTANCE / BEARING MATH ====================
    function toRadians(deg) {
      return deg * Math.PI / 180;
    }

    function toDegrees(rad) {
      return rad * 180 / Math.PI;
    }


    function distanceMiles(lat1, lon1, lat2, lon2) {

      const R = 3958.8;

      const dLat =
      toRadians(lat2 - lat1);

      const dLon =
      toRadians(lon2 - lon1);

      const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRadians(lat1)) *
      Math.cos(toRadians(lat2)) *
      Math.sin(dLon / 2) ** 2;

      const c =
      2 *
      Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
      );

      return R * c;
    }


    function bearingDegrees(lat1, lon1, lat2, lon2) {

      const φ1 = toRadians(lat1);
      const φ2 = toRadians(lat2);

      const λ1 = toRadians(lon1);
      const λ2 = toRadians(lon2);

      const y =
      Math.sin(λ2 - λ1) *
      Math.cos(φ2);

      const x =
      Math.cos(φ1) *
      Math.sin(φ2) -
      Math.sin(φ1) *
      Math.cos(φ2) *
      Math.cos(λ2 - λ1);

      return (
      toDegrees(Math.atan2(y, x)) + 360
      ) % 360;
    }


    function bearingName(deg) {

      const directions = [
      "N",
      "NE",
      "E",
      "SE",
      "S",
      "SW",
      "W",
      "NW"
      ];

      return directions[
      Math.round(deg / 45) % 8
      ];
    }

  // ==================== MAP COORDINATE HELPERS ====================
    const GA_BOUNDS = {
      north: 35.05,
      south: 30.35,
      west: -85.65,
      east: -80.75
    };


    function geoToMap(lat, lon) {

      const x =
      ((lon - GA_BOUNDS.west) /
      (GA_BOUNDS.east - GA_BOUNDS.west))
      * 500;

      const y =
      ((GA_BOUNDS.north - lat) /
      (GA_BOUNDS.north - GA_BOUNDS.south))
      * 620;

      return { x, y };
    }


  // ==================== OFFLINE NORTH GEORGIA ROAD BASE MAP ====================
    function projectLocalMapPoint(userLat, userLon, lat, lon, radiusMiles = LOCAL_RADIUS_MILES) {
      const distance = distanceMiles(userLat, userLon, lat, lon);
      const bearing = bearingDegrees(userLat, userLon, lat, lon);
      const pixelDistance = (distance / radiusMiles) * 220;
      const angle = toRadians(bearing);

      return {
        x: 250 + Math.sin(angle) * pixelDistance,
        y: 250 - Math.cos(angle) * pixelDistance,
        distance,
        bearing
      };
    }

    function drawOfflineBasemap(userLat, userLon) {
      const basemap = window.NORTH_GEORGIA_BASEMAP;
      if (!basemap || !Array.isArray(basemap.roads)) {
        console.warn("Offline North Georgia basemap is not loaded.");
        return;
      }

      const svgNS = "http://www.w3.org/2000/svg";

      const defs = document.createElementNS(svgNS, "defs");
      const clipPath = document.createElementNS(svgNS, "clipPath");
      clipPath.setAttribute("id", "localMapClip");
      const clipCircle = document.createElementNS(svgNS, "circle");
      clipCircle.setAttribute("cx", "250");
      clipCircle.setAttribute("cy", "250");
      clipCircle.setAttribute("r", "220");
      clipPath.appendChild(clipCircle);
      defs.appendChild(clipPath);
      gaMap.appendChild(defs);

      const roadGroup = document.createElementNS(svgNS, "g");
      roadGroup.setAttribute("clip-path", "url(#localMapClip)");

      basemap.roads.forEach(road => {
        if (!Array.isArray(road.points) || road.points.length < 2) return;

        const projected = road.points.map(([lat, lon]) =>
          projectLocalMapPoint(userLat, userLon, lat, lon)
        );

        const nearest = Math.min(...projected.map(p => p.distance));
        if (nearest > LOCAL_RADIUS_MILES + 8) return;

        const polyline = document.createElementNS(svgNS, "polyline");
        polyline.setAttribute("points", projected.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" "));
        polyline.setAttribute("fill", "none");
        polyline.setAttribute("stroke-linecap", "round");
        polyline.setAttribute("stroke-linejoin", "round");
        polyline.setAttribute("vector-effect", "non-scaling-stroke");

        if (road.class === "interstate") {
          polyline.setAttribute("stroke", "#607f95");
          polyline.setAttribute("stroke-width", "4");
          polyline.setAttribute("opacity", "0.90");
        } else if (road.class === "highway") {
          polyline.setAttribute("stroke", "#496a81");
          polyline.setAttribute("stroke-width", "3");
          polyline.setAttribute("opacity", "0.86");
        } else {
          polyline.setAttribute("stroke", "#38566c");
          polyline.setAttribute("stroke-width", "2");
          polyline.setAttribute("opacity", "0.78");
        }

        roadGroup.appendChild(polyline);

        const labelPoint = projected.reduce((best, p) =>
          p.distance < best.distance ? p : best, projected[0]
        );

        if (labelPoint.distance <= LOCAL_RADIUS_MILES) {
          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", (labelPoint.x + 6).toFixed(1));
          label.setAttribute("y", (labelPoint.y - 5).toFixed(1));
          label.setAttribute("fill", "#9eb9ca");
          label.setAttribute("font-size", road.class === "interstate" ? "10" : "9");
          label.setAttribute("font-weight", "650");
          label.setAttribute("paint-order", "stroke");
          label.setAttribute("stroke", "#071b2a");
          label.setAttribute("stroke-width", "3");
          label.setAttribute("stroke-linejoin", "round");
          label.textContent = road.name;
          roadGroup.appendChild(label);
        }
      });

      if (Array.isArray(basemap.places)) {
        basemap.places.forEach(place => {
          const p = projectLocalMapPoint(userLat, userLon, place.lat, place.lon);
          if (p.distance > LOCAL_RADIUS_MILES) return;

          const townDot = document.createElementNS(svgNS, "circle");
          townDot.setAttribute("cx", p.x.toFixed(1));
          townDot.setAttribute("cy", p.y.toFixed(1));
          townDot.setAttribute("r", place.rank === 1 ? "4" : "3");
          townDot.setAttribute("fill", "#7f9fb4");
          townDot.setAttribute("opacity", "0.85");
          roadGroup.appendChild(townDot);

          const townLabel = document.createElementNS(svgNS, "text");
          townLabel.setAttribute("x", (p.x + 6).toFixed(1));
          townLabel.setAttribute("y", (p.y + 4).toFixed(1));
          townLabel.setAttribute("fill", "#b5c9d6");
          townLabel.setAttribute("font-size", place.rank === 1 ? "11" : "9");
          townLabel.setAttribute("font-weight", place.rank <= 2 ? "700" : "600");
          townLabel.setAttribute("paint-order", "stroke");
          townLabel.setAttribute("stroke", "#071b2a");
          townLabel.setAttribute("stroke-width", "3");
          townLabel.textContent = place.name;
          roadGroup.appendChild(townLabel);
        });
      }

      gaMap.appendChild(roadGroup);
    }

  // ==================== FAMILY LAST-KNOWN LOCATION MAP OVERLAY ====================
    function addFamilyToMap(
    svg,
    userLat,
    userLon,
    centerX,
    centerY,
    mapRadius,
    radiusMiles
    ) {

      if (!FAMILY || !familyLocations)
      return;

      FAMILY.forEach(member => {

        const data =
        familyLocations[member.keyPrefix];

        if (!data)
        return;

        if (
        !Number.isFinite(data.lat) ||
        !Number.isFinite(data.lon)
        )
        return;


        // Distance from us to family member
        const distance =
        distanceMiles(
        userLat,
        userLon,
        data.lat,
        data.lon
        );


        // Don't plot outside map radius
        if (distance > radiusMiles)
        return;


        const bearing =
        bearingDegrees(
        userLat,
        userLon,
        data.lat,
        data.lon
        );


        /*
        Convert bearing + distance to
        position on radar.

        0 degrees = North
        90 degrees = East
        */

        const angle =
        bearing * Math.PI / 180;

        const radialDistance =
        (distance / radiusMiles) *
        mapRadius;


        const x =
        centerX +
        Math.sin(angle) *
        radialDistance;

        const y =
        centerY -
        Math.cos(angle) *
        radialDistance;


        /*
        Family marker
        */

        const dot =
        document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
        );

        dot.setAttribute("cx", x);
        dot.setAttribute("cy", y);
        dot.setAttribute("r", "8");

        dot.setAttribute(
        "class",
        "family-map-dot"
        );

        svg.appendChild(dot);


        /*
        Family name
        */

        const label =
        document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
        );

        label.setAttribute(
        "x",
        x + 12
        );

        label.setAttribute(
        "y",
        y - 3
        );

        label.setAttribute(
        "class",
        "family-map-label"
        );

        label.textContent =
        member.name;

        svg.appendChild(label);


        /*
        Distance + direction
        */

        const detail =
        document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
        );

        detail.setAttribute(
        "x",
        x + 12
        );

        svg.appendChild(detail);

      });

            );

          });


          repeaters.sort(
          (a, b) =>
          a.distance - b.distance
          );


          const nearbyRepeaters =
          repeaters.filter(
          r => r.distance <= LOCAL_RADIUS_MILES
          );

          let listHtml = "";

          if (nearbyRepeaters.length === 0) {

            listHtml = `
            <div class="repeater-empty">
            No known repeaters within
            ${LOCAL_RADIUS_MILES} miles.
            </div>
            `;

          } else {

            nearbyRepeaters.forEach(r => {

              const direction =
              bearingName(r.bearing);

              listHtml += `
              <div class="repeater-list-row">

              <div class="repeater-list-name">
              ${escapeHtml(r.name)}
              </div>

              <div class="repeater-list-distance">
              ${r.distance.toFixed(1)} mi
              </div>

              <div class="repeater-list-direction">
              ${direction}
              </div>

              </div>
              `;

            });

          }

          localRepeaterList.innerHTML = listHtml;


          gpsStatus.innerHTML =
          "📍 " +
          nearbyRepeaters.length +
          " known repeaters within " +
          LOCAL_RADIUS_MILES +
          " miles.";


          drawLocalRepeaterMap(
          userLat,
          userLon,
          repeaters
          );
          mapPanel.style.display = "block";


          let html =
          "<h3>Nearest Repeaters</h3>";


          repeaters
          .filter(r => r.distance <= LOCAL_RADIUS_MILES)
          .slice(0, 10)




          .forEach((r, index) => {

            const direction =
            bearingName(r.bearing);

            const lastSeen =
            r.lastAdvert
            ? new Date(
            r.lastAdvert * 1000
            ).toLocaleDateString()
            : "Unknown";


            html += `
            <div style="
            padding:12px;
            border-bottom:1px solid #444;
            text-align:left;
            ">

            <strong>
            ${index + 1}. ${r.name}
            </strong>

            <br>

            ${r.distance.toFixed(1)}
            miles

            ${direction}

            (${Math.round(r.bearing)}°)

            <br>

            <small>
            Last advert:
            ${lastSeen}
            </small>

            </div>
            `;

          });


          nearestRepeaters.innerHTML =
          html;

        },

        error => {

          console.error(error);

          gpsStatus.innerHTML =
          "❌ GPS error: " +
          error.message;

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 30000
        }

        );

      }

      catch(err) {

        console.error(err);

        gpsStatus.innerHTML =
        "❌ " + String(err);

      }

    };

  // ==================== MESHC0RE CONTACT PATH / BATTERY COMMANDS ====================
    async function resetContactPath(contact) {

      const publicKey =
      Uint8Array.from(
      Object.values(contact.publicKey)
      );

      const frame =
      new Uint8Array(1 + 32);

      frame[0] = 0x0D; // CMD_RESET_PATH

      frame.set(publicKey, 1);

      await connection.sendToRadioFrame(frame);
    }


    async function requestBattery() {

      await connection.sendToRadioFrame(
      new Uint8Array([0x14])
      );

    }

  // ==================== BATTERY RESPONSE LISTENER ====================
    function installBatteryListener() {

      connection.txCharacteristic.addEventListener(
      "characteristicvaluechanged",
      (event) => {

        const frame =
        new Uint8Array(event.target.value.buffer);

        if (frame[0] !== 0x0C)
        return;

        if (frame.length < 4)
        return;

        const millivolts =
        frame[1] |
        (frame[2] << 8);

        const batteryPercent =
        frame[3];

        const volts =
        millivolts / 1000;

        batteryStatus.textContent =
        batteryPercent + "%";

        if (batteryVolts) {
          batteryVolts.textContent = volts.toFixed(2) + " V";
        }

        console.log(
        "Battery:",
        batteryPercent + "%",
        volts.toFixed(3) + "V"
        );

      }
      );

    }

  // ==================== VISIBLE UI EVENT HANDLERS ====================
    const radioStatusCard = document.getElementById("radioStatusCard");

    radioStatusCard.addEventListener("click", () => {
      if (!connectBtn.disabled) connectBtn.click();
    });

    radioStatusCard.addEventListener("keydown", (event) => {
      if ((event.key === "Enter" || event.key === " ") && !connectBtn.disabled) {
        event.preventDefault();
        connectBtn.click();
      }
    });

    // Also make the map itself re-run the GPS/repeater calculation when tapped.
    document.querySelector(".map-shell").addEventListener("click", (event) => {
      if (event.target.closest("#radioStatusCard")) return;
      if (!mapRepeatersBtn.disabled) mapRepeatersBtn.click();
    });


  // ==================== FAMILY STATUS / ID MATCHING ====================
    function getFamilyMember(keyPrefix) {

      const key =
      String(keyPrefix || "").toLowerCase();

      return FAMILY.find(member =>
      key.startsWith(member.keyPrefix.toLowerCase()) ||
      member.keyPrefix.toLowerCase().startsWith(key)
      );
    }


    function formatLastSeen(timestamp) {

      if (!timestamp)
      return "No check-in received";

      const seconds =
      Math.max(
      0,
      Math.floor(Date.now() / 1000) - timestamp
      );

      if (seconds < 60)
      return "Checked in just now";

      const minutes =
      Math.floor(seconds / 60);

      if (minutes < 60)
      return `Checked in ${minutes} min ago`;

      const hours =
      Math.floor(minutes / 60);

      if (hours < 24)
      return `Checked in ${hours} hr${hours === 1 ? "" : "s"} ago`;

      const days =
      Math.floor(hours / 24);

      return `Last check-in ${days} day${days === 1 ? "" : "s"} ago`;
    }


    function renderFamilyStatus() {

      let html = "";

      FAMILY.forEach(member => {

        const data =
        familyLocations[member.keyPrefix];

        let locationText =
        "Location unknown";

        if (
        data &&
        myPosition &&
        Number.isFinite(data.lat) &&
        Number.isFinite(data.lon)
        ) {

          const distance =
          distanceMiles(
          myPosition.lat,
          myPosition.lon,
          data.lat,
          data.lon
          );

          const bearing =
          bearingDegrees(
          myPosition.lat,
          myPosition.lon,
          data.lat,
          data.lon
          );

          locationText =
          `${distance.toFixed(1)} mi ${bearingName(bearing)}`;
        }

        html += `
        <div class="family-row">

        <div class="family-dot ${
        data ? "family-known" : ""
      }"></div>

      <div class="family-info">

      <div class="family-name">
      ${escapeHtml(member.name)}
      </div>

      <div class="family-time">
      ${
        data
        ? formatLastSeen(data.timestamp)
        : "No check-in received"
      }
      </div>

      </div>

      <div class="family-location">
      ${locationText}
      </div>

      </div>
      `;
    });

    familyList.innerHTML = html;
  }

  // ==================== AUTOMATIC FAMILY LOCATION CHECK-IN ====================
  async function sendLocationCheckIn() {

    if (!currentRoom)
    return;

    try {

      const position =
      await new Promise((resolve, reject) => {

        navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 8000,
          maximumAge: 60000
        }
        );

      });

      const lat =
      position.coords.latitude;

      const lon =
      position.coords.longitude;

      myPosition = {
        lat,
        lon
      };

      const timestamp =
      Math.floor(Date.now() / 1000);

      const text =
      `${FAMILY_STATUS_PREFIX}${timestamp}|${lat.toFixed(6)}|${lon.toFixed(6)}`;

      await sendRoomText(text);

      console.log(
      "Family location check-in sent:",
      text
      );

    } catch (err) {

      console.log(
      "Location check-in unavailable:",
      err
      );

    }
  }

  // ==================== LOW-LEVEL ROOM TEXT TRANSMISSION ====================
  async function sendRoomText(text) {
    if (!currentRoom) {
      throw new Error("No room selected");
    }

    const textBytes =
      new TextEncoder().encode(text);

    const publicKey =
      Uint8Array.from(
        Object.values(currentRoom.publicKey)
      );

    const timestamp =
      Math.floor(Date.now() / 1000);

    const frame =
      new Uint8Array(13 + textBytes.length);

    // CMD_SEND_TXT_MSG
    frame[0] = 0x02;
    frame[1] = 0x00;
    frame[2] = 0x00;

    frame.set(
      uint32ToLEBytes(timestamp),
      3
    );

    frame.set(
      publicKey.slice(0, 6),
      7
    );

    frame.set(textBytes, 13);

    await connection.sendToRadioFrame(frame);
  }
